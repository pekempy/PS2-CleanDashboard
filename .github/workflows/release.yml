name: Build PS2 UI & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Pillow & OPHTML Baker
        run: |
          python -m pip install --upgrade pip
          git clone https://github.com/coffeedevsolutions/OPHTML.git /tmp/ophtml
          pip install -e /tmp/ophtml/packages/baker

      - name: Compile PS2 UI Blob
        run: |
          ps2ui build ps2ui.json

      - name: Validate PS2 UI Blob (Strict Mode)
        run: |
          ps2ui-check build/ui.uib

      - name: Generate All Screens Montage
        run: |
          python -c "
          from ps2ui_bake import uib, preview
          from PIL import Image, ImageDraw

          f = uib.read_uib('build/ui.uib')
          screens = f.screens
          cols = 3
          rows = 2
          w, h = f.canvas_w, f.canvas_h
          gap = 16
          header_h = 24

          sheet = Image.new('RGB', (cols * w + (cols + 1) * gap, rows * (h + header_h) + (rows + 1) * gap), (20, 24, 32))
          d = ImageDraw.Draw(sheet)

          for i, s in enumerate(screens):
              img = preview.render(f, screen=i)
              col = i % cols
              row = i // cols
              x = gap + col * (w + gap)
              y = gap + row * (h + header_h + gap)
              d.text((x + 8, y + 4), f'SCREEN {i+1}: {s[\"name\"].upper()}', fill=(180, 200, 220))
              sheet.paste(img, (x, y + header_h))

          sheet.save('build/screens.png')
          "

      - name: Create Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "PS2 Clean Dashboard ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/ui.uib
            build/preview.png
            build/screens.png
            build/states.png
            PSBBN_MIGRATION_GUIDE.md
