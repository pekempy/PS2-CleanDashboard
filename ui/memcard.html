<!doctype html>
<html>
<body>
<div class="screen">

  <div class="sidebar">
    <div class="brand">
      <h1>PS2</h1>
      <p class="sub">DASHBOARD</p>
    </div>
    <div class="nav">
      <div class="nav-btn" id="nav-home" focusable>
        <p class="nav-label">Home</p>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-btn" id="nav-ps2" focusable>
        <p class="nav-label">PS2 Games</p>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-btn" id="nav-psx" focusable>
        <p class="nav-label">PSX Games</p>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-btn" id="nav-tools" focusable>
        <p class="nav-label">Tools</p>
        <div class="nav-dot"></div>
      </div>
      <div class="nav-btn active" id="nav-memcard" focusable autofocus>
        <p class="nav-label">Memory Card</p>
        <div class="nav-dot"></div>
      </div>
    </div>
    <div class="sidebar-spacer"></div>
    <div class="card-info">
      <p class="card-info-h">SLOT 1</p>
      <p class="card-info-v">8 MB · 61 free</p>
    </div>
    <div class="net-info">
      <p class="net-info-h">FTP SERVER</p>
      <p class="net-info-v" data-slot="memcard-net-ip" data-slot-capacity="22">192.168.1.150:21</p>
      <p class="net-info-sub" data-slot="memcard-net-user" data-slot-capacity="22">user: ps2 / anon</p>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h2>MEMORY CARD</h2>
      <p class="count" data-slot="save-count" data-slot-capacity="16">12 saves</p>
    </div>

    <div class="savelist">
      <div class="row" data-repeat="7" id="save-{i}" focusable>
        <div class="save-icon"><p class="save-icon-label">GT</p></div>
        <div class="row-meta">
          <p class="save-title" data-slot="save-{i}-title" data-slot-capacity="34">Save Title {n}</p>
          <p class="save-meta" data-slot="save-{i}-meta" data-slot-capacity="24">Slot 1 &middot; 03:24:10</p>
        </div>
        <p class="save-blocks" data-slot="save-{i}-blocks" data-slot-capacity="12">12 blocks</p>
      </div>
    </div>

    <div class="footer">
      <p class="hint">&#9651; COPY</p>
      <p class="hint">&#9651; DELETE</p>
      <p class="hint">&#10005; BACK</p>
    </div>
  </div>

</div>
</body>
</html>
